<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Journal</title>
  
  <!-- Google Fonts: Inter & DM Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       Root Variables & Reset
       ========================================================================== */
    :root {
      --bg-color: #0d0f12;
      --card-bg: rgba(22, 27, 34, 0.6);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-border-hover: rgba(220, 38, 38, 0.4);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-crimson: #dc2626;
      --accent-crimson-light: #f87171;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    /* Container */
    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Header */
    header.site-header {
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.5rem;
    }

    header.site-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    header.site-header p {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       Card Component (Block Style)
       ========================================================================== */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(220, 38, 38, 0.08);
    }

    /* Meta: Badge & Date Alignment */
    .card .meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }

    .badge {
      background: rgba(220, 38, 38, 0.15);
      color: var(--accent-crimson-light);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .date {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    /* Card Content */
    .card h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .card h3 a {
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .card h3 a:hover {
      color: var(--accent-crimson-light);
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .card p strong {
      color: var(--text-main);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 1.5rem 0.8rem;
      }
      .card {
        padding: 1.2rem;
      }
      header.site-header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Site Header -->
    <header class="site-header">
      <h1>CS Journal</h1>
      <p>Developer logs, progress updates & hackathon notes.</p>
    </header>

    <!-- Posts Container -->
    <section class="cards-list">

      <!-- Open Hackathon Card -->
      <article class="card">
        <div class="meta">
          <span class="badge">HACKATHON</span>
          <span class="date">26.09.25</span>
        </div>

        <h3>
          <a href="./posts/lost-in-space-hackathon.html">
            Participating in Open Hackathon: Team MVPrompt & Challenge #11
          </a>
        </h3>

        <p>
          Joining Open Hackathon on Sept 25–26 with team <strong>MVPrompt</strong>. 
          We're tackling Challenge #11: designing an adaptive AI companion for ADHD support.
        </p>
      </article>

    </section>

  </main>

</body>
</html>
